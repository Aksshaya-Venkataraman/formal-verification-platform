[project]
name = "formal-verification-platform"
version = "1.0.0"
requires-python = ">=3.12"

[tool.pytest.ini_options]
addopts = "-q -p no:cacheprovider"
pythonpath = [".", "tests"]
testpaths = ["tests"]

[tool.coverage.run]
source = ["fvp"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF"]
ignore = ["B008", "RUF012", "SIM108"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]
"fvp/provers/**" = ["S603", "S404"]

[tool.bandit]
exclude_dirs = ["tests", ".venv"]
