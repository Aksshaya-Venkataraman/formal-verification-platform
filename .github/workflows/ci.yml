name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend lint, SAST, audit and unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check . && ruff format --check .
      - run: bandit -c pyproject.toml -r fvp wsgi.py cli.py
      - run: pip-audit -r requirements.txt --disable-pip --no-deps
      # Prover integration tests run inside the Docker test image (job below).
      - run: pytest --cov --cov-report=term-missing

  frontend:
    name: Frontend audit, tests and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm audit --audit-level=moderate
      - run: npm test
      - run: npm run build

  secret-scan:
    name: Secret scan (full git history)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  docker:
    name: Provers in Docker, full test suite and HTTPS smoke test
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      - name: Build backend test image (compiles Vampire and Otter; cached)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: backend/Dockerfile
          target: test
          tags: fvp-backend:test
          load: true
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend
      - name: Full test suite with SPASS, Vampire and Otter
        run: docker run --rm fvp-backend:test
      - name: Build runtime image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: backend/Dockerfile
          target: runtime
          tags: fvp-backend:local
          load: true
          cache-from: type=gha,scope=backend
      - name: Build web image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: frontend/Dockerfile
          tags: fvp-web:local
          load: true
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web
      - run: python3 scripts/generate_env.py --domain localhost
      - run: docker compose up -d --no-build --wait --wait-timeout 180
      - run: bash scripts/smoke_test.sh https://localhost
      - name: Logs on failure
        if: failure()
        run: docker compose logs --no-color
      - if: always()
        run: docker compose down -v
