# Production stack: Caddy (HTTPS + React app) -> Flask API (+ SPASS, Vampire, Otter)
#                                                     -> PostgreSQL, Redis
#
#   python3 scripts/generate_env.py
#   docker compose up -d --build --wait

name: formal-verification

x-hardening: &hardening
  restart: unless-stopped
  read_only: true
  security_opt: ["no-new-privileges:true"]
  cap_drop: ["ALL"]

services:
  web:
    image: fvp-web:local
    build:
      context: .
      dockerfile: frontend/Dockerfile
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in .env}
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    cap_add: ["NET_BIND_SERVICE"]
    depends_on:
      backend:
        condition: service_healthy
    networks: [edge]

  backend:
    <<: *hardening
    image: fvp-backend:local
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: runtime
    # Prover scratch files live in this tmpfs; nothing else is writable.
    tmpfs: ["/tmp:size=512m"]
    environment:
      ENVIRONMENT: production
      SECRET_KEY: ${SECRET_KEY:?}
      DATABASE_URL: postgresql+psycopg://${APP_DB_USER:?}:${APP_DB_PASSWORD:?}@db:5432/${APP_DB_NAME:?}
      ALLOWED_ORIGINS: https://${DOMAIN}
      ALLOWED_HOSTS: ${DOMAIN},backend,localhost,127.0.0.1
      TRUST_PROXY: "true"
      RATE_LIMIT_STORAGE_URI: redis://:${REDIS_PASSWORD:?}@redis:6379/0
      MAX_CONCURRENT_PROVERS: ${MAX_CONCURRENT_PROVERS:-4}
      MAX_TIME_LIMIT: ${MAX_TIME_LIMIT:-30}
    expose: ["8000"]
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks: [edge, backend]

  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD:?}
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
      APP_DB_USER: ${APP_DB_USER:?}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?}
      APP_DB_NAME: ${APP_DB_NAME:?}
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./deploy/postgres-init:/docker-entrypoint-initdb.d:ro
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [backend]

  redis:
    <<: *hardening
    image: redis:8-alpine
    # Start as the image's unprivileged user: with all capabilities dropped the
    # entrypoint cannot switch users itself.
    user: redis
    tmpfs: ["/tmp"]
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?}", "--save", "", "--appendonly", "no"]
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD:?}
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
    networks: [backend]

networks:
  edge: {}
  backend:
    internal: true

volumes:
  db_data: {}
  caddy_data: {}
  caddy_config: {}
